<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa Enchivi</title><style>body{font:16px Arial;background:#f3f5f4;margin:0;color:#18302a}header{background:#087b55;color:white;text-align:center;padding:18px}main{max-width:650px;margin:auto;padding:12px}section{background:white;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 1px 5px #0001}input,button{box-sizing:border-box;width:100%;padding:12px;margin:5px 0;font-size:16px;border-radius:8px}input{border:1px solid #bbb}button{border:0;background:#087b55;color:white;font-weight:bold}button.alt{background:#e3eee9;color:#075b40}.item{padding:10px 0;border-bottom:1px solid #ddd}.small{font-size:13px;color:#666}.good{color:#087b55}video{width:100%;max-height:250px;background:#222;border-radius:8px}label input{width:auto}#status{font-weight:bold}</style></head><body><header><h1>🛒 Mapa Enchivi</h1>H-E-B SoCo · Catálogo personal</header><main><section><h2>🔎 Buscar productos</h2><input id="search" placeholder="Nombre, tamaño, pasillo o código"><div id="catalog"></div></section><section><h2>📋 Lista de compras</h2><input id="wanted" placeholder="Nombre del producto"><button id="add">Agregar a la lista</button><p id="count"></p><button class="alt" id="sort">Ordenar por recorrido aproximado</button><div id="list"></div></section><section><h2>📷 Escanear código</h2><video id="camera" playsinline muted></video><button id="scan">Abrir cámara</button><button class="alt" id="stop">Detener cámara</button><input id="codeInput" placeholder="O escribe el código manualmente"><button id="verify">Verificar código</button><p id="status"></p></section><section><h2>➕ Guardar producto</h2><input id="name" placeholder="Nombre exacto"><input id="brand" placeholder="Marca"><input id="size" placeholder="Tamaño, peso u onzas"><input id="aisle" placeholder="Pasillo y sección, ej. 9, B16"><input id="barcode" placeholder="Código de barras"><button id="save">Guardar producto</button><p class="small">Comprueba los datos en el empaque. Los pasillos pueden cambiar.</p></section><section><h2>💾 Respaldo</h2><button class="alt" id="export">Exportar catálogo y lista</button><input type="file" id="import" accept="application/json,.json"><p class="small">Los datos quedan en este navegador. Exporta una copia con frecuencia.</p></section></main><script>
const P='enchivi-products-1',L='enchivi-list-1';const $=id=>document.getElementById(id);function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}let products=load(P,[{name:'H-E-B Texas Tough Oval Foil Roaster Pan',brand:'H-E-B',size:'17.9 x 14.1 pulgadas',aisle:'9, B16',barcode:''}]),list=load(L,[]);function store(){localStorage.setItem(P,JSON.stringify(products));localStorage.setItem(L,JSON.stringify(list))}function el(tag,txt,cls){let n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cls)n.className=cls;return n}function button(txt,fn,cls){let b=el('button',txt,cls);b.onclick=fn;return b}function render(){let box=$('catalog');box.replaceChildren();let q=$('search').value.trim().toLowerCase();products.forEach((p,i)=>{if(![p.name,p.brand,p.size,p.aisle,p.barcode].join(' ').toLowerCase().includes(q))return;let d=el('div',undefined,'item');d.append(el('strong',p.name),el('div',`${p.brand||'Sin marca'} · ${p.size||'Sin tamaño'}`,'small'),el('div','📍 '+(p.aisle||'Sin pasillo'),'good'),el('div','Código: '+(p.barcode||'No registrado'),'small'),button('Añadir a lista',()=>{list.push({...p,done:false});store();renderList()},'alt'));box.append(d)});if(!box.childNodes.length)box.append(el('p','No hay coincidencias en tu catálogo.'));renderList()}function renderList(){let box=$('list');box.replaceChildren();$('count').textContent=`${list.filter(p=>p.done).length} de ${list.length} encontrados`;list.forEach((p,i)=>{let d=el('div',undefined,'item'),lab=el('label'),c=el('input');c.type='checkbox';c.checked=!!p.done;c.onchange=()=>{p.done=c.checked;store();renderList()};lab.append(c,document.createTextNode(' '+p.name));d.append(lab,el('div','📍 '+(p.aisle||'Pasillo sin confirmar'),'small'),button('Quitar',()=>{list.splice(i,1);store();renderList()},'alt'));box.append(d)})}function rank(p){let n=parseInt((p.aisle||'').match(/\d+/)?.[0]);if(n>=25&&n<=43)return 43-n;if(n>=1&&n<=13)return 100+13-n;return 60}function check(code){code=String(code||'').trim();if(!code){$('status').textContent='Introduce un código.';return}let p=products.find(x=>x.barcode&&x.barcode===code);if(!p){$('status').textContent='⚠️ Código desconocido. Verifica el empaque.';return}let x=list.find(x=>!x.done&&x.barcode===code);if(x){x.done=true;store();renderList();$('status').textContent='✅ Coincide y marcado: '+p.name+' · '+p.size}else $('status').textContent='✅ En catálogo: '+p.name+' · '+p.size+' (no pendiente en la lista)'}$('search').oninput=render;$('add').onclick=()=>{let name=$('wanted').value.trim();if(!name)return;let p=products.find(p=>p.name.toLowerCase()===name.toLowerCase());list.push(p?{...p,done:false}:{name,brand:'',size:'',aisle:'',barcode:'',done:false});$('wanted').value='';store();renderList()};$('sort').onclick=()=>{list.sort((a,b)=>rank(a)-rank(b));store();renderList()};$('save').onclick=()=>{let p={name:$('name').value.trim(),brand:$('brand').value.trim(),size:$('size').value.trim(),aisle:$('aisle').value.trim(),barcode:$('barcode').value.trim()};if(!p.name){alert('Escribe el nombre');return}if(p.barcode&&products.some(x=>x.barcode===p.barcode)){alert('Ese código ya existe');return}products.push(p);store();['name','brand','size','aisle','barcode'].forEach(k=>$(k).value='');render();alert('Producto guardado')};$('verify').onclick=()=>check($('codeInput').value);let stream=null,active=false;function stop(){active=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('camera').srcObject=null}async function start(){if(!('BarcodeDetector'in window)){$('status').textContent='El navegador no admite detección automática. Usa el código manual.';return}try{let detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});$('camera').srcObject=stream;await $('camera').play();active=true;$('status').textContent='Apunta al código de barras';async function loop(){if(!active)return;try{let codes=await detector.detect($('camera'));if(codes.length){check(codes[0].rawValue);stop();return}}catch{}if(active)requestAnimationFrame(loop)}loop()}catch(e){$('status').textContent='No se pudo abrir la cámara: '+e.message;stop()}}$('scan').onclick=start;$('stop').onclick=stop;$('export').onclick=()=>{let blob=new Blob([JSON.stringify({products,list},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mapa-enchivi-respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.products)||!Array.isArray(d.list))throw Error('Formato incorrecto');if(!confirm('¿Reemplazar el catálogo y la lista actuales?'))return;products=d.products;list=d.list;store();render();alert('Datos importados')}catch(e){alert('Error: '+e.message)}};render();
</script></body></html>
